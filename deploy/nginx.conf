# ==========================================
# StaffDeck Nginx 反向代理配置参考
# ==========================================

# 1. HTTP 强制跳转 HTTPS (公网部署推荐)
server {
    listen 80;
    server_name staff.yourdomain.com;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 站点配置
server {
    listen 443 ssl http2;
    server_name staff.yourdomain.com;

    # SSL 证书文件路径 (请替换为实际证书路径)
    # ssl_certificate     /etc/nginx/ssl/staff.yourdomain.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/staff.yourdomain.com.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # 客户端上传限制 (允许上传知识库大文档与附件)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ----------------------------------------------------
        # WebSocket 支持 (对话与协同状态长连接)
        # ----------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ----------------------------------------------------
        # 核心关键: 禁用缓冲区以保证大模型 SSE 流式打字机效果实时显示
        # ----------------------------------------------------
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 对话生成或复杂任务的长超时时间
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
